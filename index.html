<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas AI</title><style>*{box-sizing:border-box}body{margin:0;background:#080d14;color:#f5f7fb;font-family:system-ui,sans-serif}nav{padding:20px 6%;border-bottom:1px solid #233044;display:flex;justify-content:space-between}.wrap{max-width:900px;margin:auto;padding:55px 6%}.card{background:#101925;border:1px solid #26364b;border-radius:18px;padding:20px}.pill{border:1px solid #304056;border-radius:99px;padding:7px 12px;font-size:12px}.muted{color:#97a4b7}.row{display:flex;gap:10px}.input{flex:1;background:#0a111b;color:white;border:1px solid #304056;border-radius:10px;padding:14px}.btn{background:#e44;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:800}.msg{margin:14px 0;padding:15px;border-radius:14px;background:#0b121d}</style></head><body><nav><b>ATLAS <span style="color:#e44">AI</span></b><span class="pill">MODEL ONLINE</span></nav><main class="wrap"><div class="card"><span class="pill">AI WORKSPACE</span><h1>Ask anything.<br><span style="color:#e44">Build faster.</span></h1><p class="muted">A product-assistant interface for business ideas, workflows and project planning.</p><div id="chat"><div class="msg"><b>Atlas</b><p class="muted">Hi. Tell me what you want to build and I will turn it into a clear product plan.</p></div></div><div class="row"><input id="m" class="input" placeholder="Ask Atlas..." onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div></div></main><script>function send(){let i=document.getElementById('m'),v=i.value.trim();if(!v)return;let c=document.getElementById('chat');c.innerHTML+=`<div class="msg"><b>You</b><p class="muted">${v}</p></div>`;setTimeout(()=>c.innerHTML+=`<div class="msg"><b>Atlas</b><p class="muted">Demo response: I can break this into features, screens, user flows and launch steps.</p></div>`,300);i.value=''}</script></body></html>
